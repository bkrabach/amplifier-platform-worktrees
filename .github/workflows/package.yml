name: Worktrees package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Full merged commit SHA to build and verify
        required: true
        type: string
      publish:
        description: Publish the verified immutable artifacts after installed checks
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Check publication refusal and recovery
        run: |
          controls="$RUNNER_TEMP/worktrees-release-tests"
          mkdir "$controls"
          cp -R scripts tests_release "$controls/"
          cd "$controls"
          uv run --no-project --with pytest python -m pytest -q tests_release
      - name: Select exact source
        id: plan
        env:
          SELECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/release.py plan --revision "$SELECTED_REVISION" "${flags[@]}" --output "$GITHUB_OUTPUT"
      - name: Build and seal the selected standalone artifacts
        env:
          SELECTED_REVISION: ${{ steps.plan.outputs.revision }}
        run: |
          mkdir "$RUNNER_TEMP/worktrees-source"
          git archive "$SELECTED_REVISION" | (cd "$RUNNER_TEMP/worktrees-source" && tar -x)
          uv build --sdist --wheel "$RUNNER_TEMP/worktrees-source" --out-dir "$RUNNER_TEMP/worktrees-dist"
          rm -f "$RUNNER_TEMP/worktrees-dist/.gitignore"
          flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/release.py seal --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/worktrees-dist" "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worktrees-distributions
          path: ${{ runner.temp }}/worktrees-dist/*
          if-no-files-found: error

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: worktrees-distributions
          path: ${{ runner.temp }}/worktrees-dist
      - name: Verify and test the installed wheel outside the source checkout
        env:
          SELECTED_REVISION: ${{ needs.build.outputs.revision }}
          SELECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/release.py verify --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/worktrees-dist" "${flags[@]}"
          uv venv --python 3.13 "$RUNNER_TEMP/worktrees-installed"
          python_path="$RUNNER_TEMP/worktrees-installed/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then python_path="$RUNNER_TEMP/worktrees-installed/Scripts/python.exe"; fi
          uv pip install --python "$python_path" "$RUNNER_TEMP/worktrees-dist/amplifier_worktrees-$SELECTED_VERSION-py3-none-any.whl[test]"
          mkdir "$RUNNER_TEMP/worktrees-tests"
          git archive "$SELECTED_REVISION" tests pyproject.toml | (cd "$RUNNER_TEMP/worktrees-tests" && tar -x)
          cd "$RUNNER_TEMP/worktrees-tests"
          "$python_path" -I -c 'from pathlib import Path; import sys, amplifier_worktrees; assert Path(amplifier_worktrees.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); assert not any(name in sys.modules for name in ("amplifier_web", "amplifier_core", "amplifier_foundation"))'
          "$python_path" -I -m pytest -q tests --junitxml=installed-tests.xml
          uv pip check --python "$python_path"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worktrees-installed-${{ matrix.os }}
          path: ${{ runner.temp }}/worktrees-tests/installed-tests.xml
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: [build, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: worktrees-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: worktrees-distributions
          path: ${{ runner.temp }}/worktrees-dist
      - name: Publish only the original verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_REVISION: ${{ needs.build.outputs.revision }}
        run: python scripts/release.py publish --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/worktrees-dist"
